name: dip-grid
on:
  push:
    branches: [ccr-faa98f4f-0u9bn5]
    paths: [analysis/dip_grid.py, .github/workflows/dip-grid.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy numba
      - run: python3 analysis/dip_grid.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add analysis/results/dip_grid.csv
          git commit -m "Update dip grid results"
          git push
