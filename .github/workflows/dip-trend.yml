name: dip-trend
on:
  push:
    branches: [ccr-faa98f4f-0u9bn5]
    paths: [analysis/dip_trend.py, .github/workflows/dip-trend.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy numba
      - run: python3 analysis/dip_trend.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add analysis/results/dip_trend.csv
          git commit -m "Update dip trend-filter results"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
